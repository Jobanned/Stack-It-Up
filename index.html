<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack It Up</title>
    <style>
      body { 
        margin: 0; 
        overflow: hidden; /* Prevents scrolling */
        background-color: #2c3e50; /* A nice dark blue background */
      }
      canvas { 
        display: block; 
      }
      #score {
        position: absolute;
        top: 10vh; /* Pushes it down 10% from the top of the screen */
        width: 100%;
        text-align: center;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 80px;
        font-weight: bold;
        color: white;
        z-index: 10; /* Ensures it renders above the 3D canvas */
        pointer-events: none; /* Allows mouse clicks to pass right through the text */
        text-shadow: 2px 4px 10px rgba(0,0,0,0.3); /* Adds a nice drop shadow */
      }
      #combo {
        position: absolute;
        top: 22vh; /* Puts it right below the score */
        width: 100%;
        text-align: center;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 30px;
        font-weight: bold;
        color: #f1c40f; /* A nice golden yellow */
        z-index: 10; 
        pointer-events: none; 
        text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        transition: transform 0.1s ease-in-out; /* Makes it pop when updated */
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B2V3244N.js"></script>
  </head>
  <body>
    <div id="score">0</div>
    <div id="combo"></div> 
  </body>
</html>
